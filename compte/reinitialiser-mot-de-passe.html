<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialiser le mot de passe — Jos Dore</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<link rel="stylesheet" href="/ressources/css/variables.css">
<link rel="stylesheet" href="/ressources/css/style.css">
<link rel="stylesheet" href="/ressources/css/header.css">
<style>
  body { background: var(--gris-50); display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: var(--police-texte); }
  .auth-card { background: #fff; padding: 40px; border-radius: var(--rayon-lg); box-shadow: 0 20px 40px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
  .auth-card h1 { font-family: var(--police-titre); font-size: 24px; margin-bottom: 8px; color: var(--gris-900); }
  .auth-card p { font-size: 14px; color: var(--gris-500); margin-bottom: 24px; }
  .auth-champ { margin-bottom: 18px; position: relative; }
  .auth-champ input { width: 100%; padding: 14px 16px 14px 46px; border: 1.5px solid var(--gris-200); border-radius: var(--rayon-sm); font-size: 15px; outline: none; transition: 0.3s; }
  .auth-champ input:focus { border-color: var(--or); box-shadow: 0 0 0 4px rgba(245,158,11,0.12); }
  .auth-champ i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--gris-400); font-size: 18px; }
  .auth-btn { width: 100%; padding: 16px; background: var(--or); color: var(--nuit); border: none; border-radius: var(--rayon-md); font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; }
  .auth-btn:hover { background: var(--or-fonce); }
  .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .auth-alerte { display: none; padding: 12px; background: #FEF2F2; color: #991B1B; border-radius: var(--rayon-sm); font-size: 14px; margin-bottom: 20px; border-left: 4px solid #DC2626; }
  .auth-alerte.is-visible { display: block; }
  .auth-alerte.is-succes { background: #F0FDF4; color: #166534; border-left-color: #22C55E; }
</style>
</head>
<body>

<div class="auth-card">
  <h1>Nouveau mot de passe</h1>
  <p>Choisissez votre nouveau mot de passe sécurisé.</p>
  
  <div class="auth-alerte" id="authAlerte"></div>

  <form id="resetForm">
    <div class="auth-champ">
      <i class="fi fi-rr-lock"></i>
      <input type="password" id="nouveauMdp" placeholder="Nouveau mot de passe (min 8 car.)" required>
    </div>
    <button type="submit" class="auth-btn" id="btnReset">Mettre à jour le mot de passe</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/ressources/js/config.js"></script>
<script src="/ressources/js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('resetForm');
  const mdpInput = document.getElementById('nouveauMdp');
  const btn = document.getElementById('btnReset');
  const alerte = document.getElementById('authAlerte');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alerte.classList.remove('is-visible', 'is-succes');
    
    const nouveauMdp = mdpInput.value;
    
    if (nouveauMdp.length < 8) {
      alerte.textContent = "Le mot de passe doit contenir au moins 8 caractères.";
      alerte.classList.add('is-visible');
      return;
    }

    btn.disabled = true;
    btn.textContent = "Mise à jour...";

    try {
      // Appel de la fonction dans auth.js
      const resultat = await window.JosDore.Auth.changerMotDePasse(null, nouveauMdp);
      
      if (!resultat.succes) {
        alerte.textContent = resultat.erreur || "Impossible de mettre à jour le mot de passe.";
        alerte.classList.add('is-visible');
        btn.disabled = false;
        btn.textContent = "Mettre à jour le mot de passe";
        return;
      }

      // Succès !
      alerte.textContent = "Mot de passe modifié avec succès ! Redirection vers la connexion...";
      alerte.classList.add('is-visible', 'is-succes');
      btn.textContent = "Redirection...";
      
      setTimeout(() => {
        window.location.href = '/compte/connexion.html';
      }, 2000);

    } catch (err) {
      console.error(err);
      alerte.textContent = "Une erreur réseau est survenue.";
      alerte.classList.add('is-visible');
      btn.disabled = false;
      btn.textContent = "Mettre à jour le mot de passe";
    }
  });
});
</script>
</body>
</html>
